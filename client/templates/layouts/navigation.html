{% extends '../base.html' %}
{% load static %}

{% block content %}
  <div class="grid grid-cols-[auto_1fr] grid-rows-[auto_1fr] h-dvh w-dvw p-3 pl-4 pb-safe">
    <header class="col-span-2 h-16 pb-2 z-50">
      {% include "components/topbar.html#topbar" %}
    </header>
    <aside class="hidden md:block pt-2 transition-all duration-300 w-56 data-[collapsed=true]:w-15" id="sidebar">
      {% include "components/sidebar.html#sidebar" with name="sidebar" %}
    </aside>
    <main class="overflow-y-auto p-0 col-span-2 md:col-span-1 md:pl-3 pt-2 pb-22 md:pb-0">
      {% block view %}
      {% endblock %}
    </main>
    <div class="block md:hidden fixed bottom-0 w-dvw h-20">
      {% include "components/mobilebar.html#bottombar" %}
    </div>
  </div>
  <div class="fixed h-dvh w-dvw -z-50">
    <div class="w-full h-full relative -z-50">
      <div class="bg-primary-theme/10 w-1/2 h-1/2 absolute -top-1/6 -left-1/3 blur-3xl"></div>
      <div class="bg-accent-theme/10 w-1/2 h-1/2 absolute -top-1/6 -right-1/3 blur-3xl"></div>
      <div class="bg-primary-theme/10 w-1/2 h-1/4 absolute -bottom-1/6 left-1/2 -translate-x-1/2 blur-3xl"></div>
    </div>
  </div>
{% endblock %}
