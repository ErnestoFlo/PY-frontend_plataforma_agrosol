{% load static %}
{% load partials %}

{% partialdef badge %}
  <span class="badge badge-{{ variant }} {{ x_params }}">
    <span class="badge-dot"></span>
    {{ text }}
  </span>
{% endpartialdef %}

{% partialdef badge_icon %}
  <span class="badge badge-{{ variant }} {{ x_params }}">
    <svg class="badge-icon">
      <use href="{% static 'sprite.svg' %}#{{ icon }}" />
    </svg>
    {{ text }}
  </span>
{% endpartialdef %}
