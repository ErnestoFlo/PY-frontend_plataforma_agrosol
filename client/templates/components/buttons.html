{% load static %}
{% load partials %}
  
{% partialdef button %}
  <button type="{{ func_type }}" class="btn body {{ type }} {{ x_params }}"
  data-tipo='accion'
  {% if action %}data-action="{{ action }}"{% endif %}
  {% if target %}data-target="{{ target }}"{% endif %}
  {% if hx_get %}hx-get="{{ hx_get }}"{% endif %}
  {% if hx_target %}hx-target="{{ hx_target }}"{% endif %}
  {% if hx_swap %}hx-swap="{{ hx_swap }}"{% endif %}
  {% if hx_trigger %}hx-trigger="{{ hx_trigger }}"{% endif %}
  {% if on_click %}onclick="{{ on_click }}"{% endif %}
  {% if attrs %}{{ attrs|safe }}{% endif %}
  >{{ text }}</button>
{% endpartialdef %}

{% partialdef icon_button %}
  <button type="{{ func_type }}" class="body {{ type }} {{ x_params }}"
  data-tipo='accion'
  data-sprite="{% static 'sprite.svg' %}"
  {% if role %}role="{{ role }}"{% endif %}
  {% if action %}data-action="{{ action }}"{% endif %}
  {% if target %}data-target="{{ target }}"{% endif %}
  {% if hx_get %}hx-get="{{ hx_get }}"{% endif %}
  {% if hx_target %}hx-target="{{ hx_target }}"{% endif %}
  {% if hx_swap %}hx-swap="{{ hx_swap }}"{% endif %}
  {% if hx_trigger %}hx-trigger="{{ hx_trigger }}"{% endif %}
  {% if attrs %}{{ attrs|safe }}{% endif %}
  >
    <svg class="w-{{ size }} h-{{ size }} {{ x_icon_params }}">
      <use href="{% static 'sprite.svg' %}#{{ icon_name }}"/>
    </svg>
  </button>
{% endpartialdef %}

{% partialdef icon_text_button %}
  <button type="{{ func_type }}" class="body {{ type }} {{ x_params }}"
  data-tipo='accion'
  data-sprite="{% static 'sprite.svg' %}"
  {% if role %}role="{{ role }}"{% endif %}
  {% if action %}data-action="{{ action }}"{% endif %}
  {% if target %}data-target="{{ target }}"{% endif %}
  {% if hx_get %}hx-get="{{ hx_get }}"{% endif %}
  {% if hx_target %}hx-target="{{ hx_target }}"{% endif %}
  {% if hx_swap %}hx-swap="{{ hx_swap }}"{% endif %}
  {% if hx_trigger %}hx-trigger="{{ hx_trigger }}"{% endif %}
  {% if on_click %}onclick="{{ on_click }}"{% endif %}
  {% if attrs %}{{ attrs|safe }}{% endif %}
  {% if is_disabled %}disabled{% endif %}>
    <svg class="{{ icon_size }} shrink-0" aria-hidden="true">
      <use href="{% static 'sprite.svg' %}#{{ icon_name }}"/>
    </svg>
      {{ text }}
  </button>
{% endpartialdef %}

{% partialdef input_icon_button %}
  <button type="{{ func_type }}" class="body {{ type }} {{ x_params }}" data-sprite="{% static 'sprite.svg' %}" 
  {% if action %}data-action="{{ action }}"{% endif %}
  {% if target %}data-target="{{ target }}"{% endif %}
  {% if hx_get %}hx-get="{{ hx_get }}"{% endif %}
  {% if hx_target %}hx-target="{{ hx_target }}"{% endif %}
  {% if hx_swap %}hx-swap="{{ hx_swap }}"{% endif %}
  {% if hx_trigger %}hx-trigger="{{ hx_trigger }}"{% endif %}
  {% if on_click %}onclick="{{ on_click }}"{% endif %}
  {% if attrs %}{{ attrs|safe }}{% endif %}
  >
    <svg class="w-5 h-5 {{ x_icon_params }}">
      <use href="{% static 'sprite.svg' %}#{{ icon_name }}"/>
    </svg>
  </button>
{% endpartialdef %}

{% partialdef toggle_button %}
  <button type="button"
  class="toggle-btn {{ x_params }}"
  data-tipo='accion'
  data-action="toggle"
  data-checked="{{ checked|default:'false' }}"
  {% if target %}data-target="{{ target }}"{% endif %}
  {% if name %}id="{{ name }}"{% endif %}
  {% if hx_get %}hx-get="{{ hx_get }}"{% endif %}
  {% if hx_target %}hx-target="{{ hx_target }}"{% endif %}
  {% if hx_swap %}hx-swap="{{ hx_swap }}"{% endif %}
  {% if hx_trigger %}hx-trigger="{{ hx_trigger }}"{% endif %}
  {% if attrs %}{{ attrs|safe }}{% endif %}
  >
    <span class="toggle-thumb"></span>
  </button>
{% endpartialdef %}
