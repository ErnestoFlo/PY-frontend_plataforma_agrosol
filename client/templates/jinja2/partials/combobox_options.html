{% for option in options %}
  <li class="combobox-option list-item text-sm z-10" data-value="{{ option.value }}" data-action="combobox-select">
    {{ option.label }}
  </li>
{% endfor %}

{% macro combobox_dropdown(name) %}
  <ul id="{{ name }}-options" class="list combobox-dropdown hidden" data-input="{{ name }}" tabindex="-1" style="z-index: 999;">
  </ul>
{% endmacro %}
