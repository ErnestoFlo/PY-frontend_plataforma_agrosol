{% macro combobox_dropdown(name) %}
  <ul id="{{ name }}-options" class="list combobox-dropdown hidden z-10" data-input="{{ name }}" tabindex="-1">
  </ul>
{% endmacro %}

{% macro combobox_options(options) %}
  {% for option in options %}
    <li class="combobox-option list-item text-sm z-10" data-value="{{ option.value }}" data-action="combobox-select">
      {{ option.label }}
    </li>
  {% endfor %}
{% endmacro %}
