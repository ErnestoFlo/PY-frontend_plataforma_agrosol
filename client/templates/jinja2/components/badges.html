{% macro badge(text, variant='neutral', x_params="") %}
  <span class="badge badge-{{ variant }} {{ x_params }}">
    <span class="badge-dot"></span>
    {{ text }}
  </span>
{% endmacro %}

{% macro badge_icon(text, icon, variant='neutral', x_params="") %}
  <span class="badge badge-{{ variant }} {{ x_params }}">
    <svg class="badge-icon">
      <use href="{{ static('sprite.svg') }}#{{ icon }}" />
    </svg>
    {{ text }}
  </span>
{% endmacro %}
