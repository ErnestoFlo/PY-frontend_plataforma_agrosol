{% macro avatar(user, size="4", action=none, action_icon=none, target=none, hx_get=none, hx_target=none, hx_swap=none, hx_trigger=none ) %}

  <div class="w-{{ size }} h-{{ size }} min-w-{{ size }} min-h-{{ size }} max-w-{{ size }} max-h-{{ size }} bg-surface-3 rounded-full shadow-md relative" style="width: var(--spacing-{{ size }});">
    <div 
      class="flex flex-col h-{{ size }} w-{{ size }} items-center justify-center  overflow-hidden bg-surface-3 rounded-full relative"
      {% if action %}data-action="{{ action }}"{% endif %}
      {% if target %}data-target="{{ target }}"{% endif %}
      {% if hx_get %}hx-get="{{ hx_get }}"{% endif %}
      {% if hx_target %}hx-target="{{ hx_target }}"{% endif %}
      {% if hx_swap %}hx-swap="{{ hx_swap }}"{% endif %}
      {% if hx_trigger %}hx-trigger="{{ hx_trigger }}"{% endif %}
    >
      {% if user.profile.avatar.name %}
        <img src="{{ user.profile.avatar.url }}" alt="Foto de perfil de {{ user.username }}" class="w-full h-full object-cover">
      {% else %}
        <div class="h-full w-full flex items-center justify-center text-fg font-display font-bold text-[1.5em]"> {{ user.profile.initials }} </div>
      {% endif %}
    </div>
    {% if action %}
      <div class="absolute z-50 bottom-0.5 right-0.5 w-6 h-6 rounded-full bg-primary-500 text-neutral-900 flex items-center justify-center cursor-pointer">
        <svg class="h-4 w-4">
          <use href="{{ static('sprite.svg') }}#{{ action_icon }}"/>
        </svg>
      </div>
    {% endif %}

  </div>

{% endmacro %}
